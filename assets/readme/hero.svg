<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Supply Chain 2026 / 2026 Supply Chain Research</title>
  <desc id="desc">A light editorial research cover connecting physical freight routes with the software planning layer. Cargo markers travel from Shanghai through Suez to Rotterdam.</desc>

  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#dbe2ea" stroke-width="1"/>
    </pattern>
    <clipPath id="frame-clip">
      <rect width="1200" height="420" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame-clip)">
    <rect width="1200" height="420" fill="#ffffff"/>
    <rect width="1200" height="420" fill="url(#paper-grid)" opacity=".44"/>
    <rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#dbe2ea" stroke-width="2"/>

    <g id="title-block" transform="translate(58 50)">
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#2251ff">INTERACTIVE RESEARCH EDITION / 2026</text>
      <text y="72" font-family="Georgia, Iowan Old Style, serif" font-size="58" font-weight="700" fill="#051c2c">Supply Chain 2026</text>
      <text y="111" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="22" font-weight="600" fill="#42566a">2026 Supply Chain Research / EN + ZH</text>

      <line x1="0" y1="140" x2="494" y2="140" stroke="#dbe2ea" stroke-width="2"/>
      <text y="174" font-family="Georgia, Iowan Old Style, serif" font-size="28" fill="#1233b8">The rewired network,</text>
      <text y="210" font-family="Georgia, Iowan Old Style, serif" font-size="28" fill="#1233b8">the $39B brain.</text>
      <text y="252" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#42566a">Evidence-graded research across freight, policy,</text>
      <text y="280" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" fill="#42566a">automation, markets, and agentic AI.</text>

      <g transform="translate(0 316)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <rect width="148" height="38" rx="4" fill="#f7f9fc" stroke="#2251ff"/>
        <text x="74" y="25" text-anchor="middle" font-size="18" fill="#051c2c">EN / ZH</text>
        <rect x="162" width="212" height="38" rx="4" fill="#f7f9fc" stroke="#dbe2ea"/>
        <text x="268" y="25" text-anchor="middle" font-size="18" fill="#42566a">24 SOURCE ANCHORS</text>
      </g>
    </g>

    <line x1="590" y1="28" x2="590" y2="392" stroke="#dbe2ea" stroke-width="2"/>

    <g id="network-map" transform="translate(632 50)">
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#8595a6">PHYSICAL NETWORK TO DECISION LAYER</text>

      <g transform="translate(0 48)">
        <path id="trade-route" d="M18 220 C112 128 194 186 278 106 S426 44 500 86" fill="none" stroke="#dbe2ea" stroke-width="12" stroke-linecap="round"/>
        <path d="M18 220 C112 128 194 186 278 106 S426 44 500 86" fill="none" stroke="#2251ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 10">
          <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3.6s" repeatCount="indefinite"/>
        </path>

        <g fill="#ffffff" stroke="#2251ff" stroke-width="3">
          <circle cx="18" cy="220" r="9"/>
          <circle cx="278" cy="106" r="9"/>
          <circle cx="500" cy="86" r="9"/>
        </g>
        <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#42566a">
          <text x="18" y="250" text-anchor="middle">SHA</text>
          <text x="278" y="136" text-anchor="middle">SUEZ</text>
          <text x="500" y="116" text-anchor="middle">RTM</text>
        </g>

        <circle id="cargo-marker-a" r="6" fill="#2251ff">
          <animateMotion dur="4.8s" repeatCount="indefinite" path="M18 220 C112 128 194 186 278 106 S426 44 500 86"/>
        </circle>
        <circle id="cargo-marker-b" r="5" fill="#008a6d">
          <animateMotion dur="4.8s" begin="-2.4s" repeatCount="indefinite" path="M18 220 C112 128 194 186 278 106 S426 44 500 86"/>
        </circle>

        <g id="container-ship" transform="translate(58 168)">
          <path d="M0 42H198L178 70H24Z" fill="#f7f9fc" stroke="#051c2c" stroke-width="2"/>
          <rect x="20" y="18" width="152" height="25" fill="#1233b8"/>
          <g stroke="#ffffff" stroke-width="2">
            <rect x="26" y="-8" width="40" height="25" fill="#2251ff"/>
            <rect x="69" y="-8" width="40" height="25" fill="#008a6d"/>
            <rect x="112" y="-8" width="40" height="25" fill="#b07a10"/>
            <rect x="42" y="-34" width="40" height="25" fill="#2251ff"/>
            <rect x="85" y="-34" width="40" height="25" fill="#7d9bff"/>
          </g>
          <rect x="158" y="-22" width="24" height="64" fill="#ffffff" stroke="#051c2c" stroke-width="2"/>
        </g>

        <g id="decision-cards" transform="translate(320 154)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
          <rect width="188" height="62" rx="5" fill="#f7f9fc" stroke="#dbe2ea" stroke-width="2"/>
          <text x="16" y="25" font-size="18" fill="#8595a6">PLANNING LAYER</text>
          <text x="16" y="50" font-size="23" font-weight="700" fill="#2251ff">$39.2B / +10.7%</text>
          <rect y="74" width="188" height="62" rx="5" fill="#f7f9fc" stroke="#dbe2ea" stroke-width="2"/>
          <text x="16" y="99" font-size="18" fill="#8595a6">AGENTIC AI</text>
          <text x="16" y="124" font-size="23" font-weight="700" fill="#051c2c">51% PILOTING</text>
          <circle cx="171" cy="93" r="5" fill="#008a6d">
            <animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>

    <text x="1140" y="397" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8595a6">DATA AS OF 2026-07-17 / NO INVESTMENT ADVICE</text>
  </g>
</svg>

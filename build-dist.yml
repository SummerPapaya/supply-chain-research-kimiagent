name: Rebuild dist-single bundle

on:
  push:
    paths:
      - "index.html"
      - "bundle.py"
      - "js/**"
      - "css/**"
      - ".github/workflows/build-dist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild single-file bundle
        run: python3 bundle.py

      - name: Commit bundle if changed
        run: |
          if git diff --quiet -- dist-single.html; then
            echo "dist-single.html already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist-single.html
            git commit -m "chore: rebuild dist-single.html [skip ci]"
            git push origin HEAD:main
          fi
